<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wusa Legal</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: linear-gradient(165deg, #FFD4C4, #FFF8F6 45%, #fff);
      color: #241916;
    }
    .card {
      width: min(440px, 92vw); background: #fff; border-radius: 20px;
      padding: 28px 24px; box-shadow: 0 12px 40px rgba(159,60,22,0.12);
      border: 1px solid #DEC0B7;
    }
    h1 { margin: 0 0 8px; color: #FF6B35; }
    a.btn {
      display: block; margin-top: 12px; text-align: center; text-decoration: none;
      background: linear-gradient(90deg, #FF6B35, #FF8F4A); color: #fff;
      padding: 14px 16px; border-radius: 999px; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Wusa Legal</h1>
    <p>Terms of Devotion and Privacy Policy for the Wusa iOS app.</p>
    <a class="btn" href="./wusa/terms/">Terms of Devotion</a>
    <a class="btn" href="./wusa/privacy/">Privacy Policy</a>
  </div>
</body>
</html>
